<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Progress</title>
    <style>
        body {
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #card {
            height: 500px;
            width: 400px;
            background-color: white;
            border-radius: 10%;
        }

        img {
            height: 55%;
            width: 90%;
            object-fit: cover;
            object-position: center;
            border-radius: 9%;
            padding: 15px 0px 0px 17px;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        h5 {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-top: 0px;
            color: red;
        }

        #btn {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn button {
            background-color: cadetblue;
            font-weight: 700;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="card">
        <img src="https://img.freepik.com/free-photo/anime-girl-cherry-blossoms-full-moon_23-2152016699.jpg" alt="">
        <h1>Angel Sona</h1>
        <h5>Stranger</h5>
        <div id="btn">
            <button id="add">Add Friend</button>
        </div>
    </div>
</body>
<script>
    var res = document.querySelector("h5");
    var addFrnd = document.querySelector("#add");
    var check = 0;
    addFrnd.addEventListener("click", function () {
        if (check == 0) {
            res.innerHTML = "Friends";
            addFrnd.innerHTML = "Remove Friend";
            addFrnd.style.color = "black";
            res.style.color = "green";
            check = 1;
        } else {
            res.innerHTML = "Stranger";
            addFrnd.innerHTML = "Add Friend";
            addFrnd.style.backgroundColor = "cadetblue";
            res.style.color = "red";
            check = 0;
        }
    })

</script>

</html>
